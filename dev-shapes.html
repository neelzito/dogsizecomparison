<!doctype html>
<html><head><meta charset="utf-8"><title>Shapes</title>
<style>body{font:12px system-ui;display:flex;flex-wrap:wrap;gap:8px;padding:8px;background:#f6f3ee}
div{background:#fff;width:190px;text-align:center}svg{width:190px;height:130px;color:#4a6;}
.far,.ear{filter:brightness(.7)}.eye{fill:#fff}</style></head>
<body><script src="js/dog-renderer.js"></script><script>
for (const t of Object.keys(DogRenderer.TYPES)) {
  const s = DogRenderer.build(t);
  const w = s.maxX - s.minX, h = Math.max(s.maxY, 1.4);
  document.body.insertAdjacentHTML("beforeend", `<div><svg viewBox="${s.minX - .05} ${-h - .05} ${Math.max(w, 2.2) + .1} ${h + .1}"><g transform="scale(1 -1)">${s.markup}</g><line x1="-1" x2="3" y1="0" y2="0" stroke="#999" stroke-width=".01"/></svg>${t}</div>`);
}
</script></body></html>
